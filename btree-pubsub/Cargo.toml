[package]
name = "btree-pubsub"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-postgres = "0.7"
postgres-protocol = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = "0.21"
futures-util = "0.3"
heed = "0.20"  # LMDB wrapper for Rust
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.5"
uuid = { version = "1.6", features = ["v4"] }
prost = "0.12"

[build-dependencies]
prost-build = "0.12"
prost = "0.12"
postgres-types = "0.2"
