services:
  thunderdb-worker:
    image: node
    working_dir: /workspace/thunderdb-ts
    environment:
      - WORKER_PORT=4100
      - THUNDERDB_DOCSTORE_DURABILITY=relaxed
    volumes:
      - ./thunderdb-ts:/workspace/thunderdb-ts
    command: >-
      sh -c "npm run worker"
    ports:
      - "4100:4100"
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  thunderdb-perf:
    image: node
    working_dir: /workspace/thunderdb-ts
    environment:
      - PERF_REMOTE_WORKER=1
      - PERF_WORKER_HOST=thunderdb-worker
      - PERF_WORKER_PORT=4100
      - PERF_DOCUMENTS=1000000
      - PERF_CUSTOMERS=100000
      - PERF_DURATION=10
      - PERF_UPDATE_RATE=0.05
      - PERF_INSERT_RATE=0.01
      - PERF_DELETE_RATE=0.01
      - PERF_DEBUG_EVICS=0
      - PERF_ENABLE_RETRIEVAL=true
    volumes:
      - ./thunderdb-ts:/workspace/thunderdb-ts
    command: >-
      sh -c "npm run perf"
    extra_hosts:
      - "host.docker.internal:host-gateway"