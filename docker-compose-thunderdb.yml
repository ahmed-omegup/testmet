services:
  thunderdb-worker:
    image: oven/bun:1
    working_dir: /workspace/thunderdb-ts
    environment:
      - WORKER_PORT=4100
      - THUNDERDB_DOCSTORE_DURABILITY=relaxed
    volumes:
      - ./thunderdb-ts:/workspace/thunderdb-ts
    command: >-
      sh -c "bun install --no-save && bun run src/socketWorker.ts"
    ports:
      - "4100:4100"

  thunderdb-perf:
    image: oven/bun:1
    working_dir: /workspace/thunderdb-ts
    environment:
      - PERF_REMOTE_WORKER=1
      - PERF_WORKER_HOST=host.docker.internal
      - PERF_WORKER_PORT=5050
      - PERF_DOCUMENTS=1000000
      - PERF_CUSTOMERS=100000
      - PERF_DURATION=1
      - PERF_UPDATE_RATE=0.05
      - PERF_INSERT_RATE=0.01
      - PERF_DELETE_RATE=0.01
      - PERF_DEBUG_EVICS=0
      - PERF_ENABLE_RETRIEVAL=true
    volumes:
      - ./thunderdb-ts:/workspace/thunderdb-ts
    command: >-
      sh -c "bun install --no-save && bun run src/perf.ts"
    extra_hosts:
      - "host.docker.internal:host-gateway"