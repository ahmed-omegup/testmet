version: "3.9"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  meteor:
    build: ./meteor
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017/benchmark
      - PORT=3000
      - METEOR_ALLOW_SUPERUSER=true
    depends_on:
      - mongo

  tester:
    build: ./tester
    depends_on:
      - meteor
    environment:
      - MONGO_URL=mongodb://mongo:27017/benchmark
      - METEOR_URL=ws://meteor:3000/websocket
      - CUSTOMERS=100000
      - DURATION=10
      - INIT_TIME=10
    command: ["node", "main.js"]

volumes:
  mongo_data: