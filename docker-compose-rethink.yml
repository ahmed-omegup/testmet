services:
  rethinkdb:
    image: rethinkdb:latest
    restart: unless-stopped
    command:
      - rethinkdb
      - --bind
      - all
    ports:
      - "8080:8080"  # Admin UI
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  tester:
    build: ./tester
    depends_on:
      - rethinkdb
    environment:
      - RETHINKDB_HOST=rethinkdb
      - RETHINKDB_PORT=28015
      - CUSTOMERS=500
      - DURATION=10
      - INIT_TIME=10
      - DOCUMENTS=10000
    volumes:
      - ./tester/main.js:/app/main.js
      - ./tester/log:/app/log
    command: ["node", "main.js"]
