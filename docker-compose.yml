
services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    command:
      - --storageEngine=wiredTiger
      - --replSet=rs0
      - --quiet
    volumes:
      - ./mongo/init-rs.js:/docker-entrypoint-initdb.d/init-rs.js

  meteor:
    build: ./meteor
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017/benchmark?replicaSet=rs0&directConnection=true
      - PORT=3000
      - METEOR_ALLOW_SUPERUSER=true
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 10

  tester:
    build: ./tester
    depends_on:
      meteor:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://mongo:27017/benchmark?replicaSet=rs0&directConnection=true
      - METEOR_URL=ws://meteor:3000/websocket
      - CUSTOMERS=100000
      - DURATION=10
      - INIT_TIME=10
    command: ["node", "main.js"]

